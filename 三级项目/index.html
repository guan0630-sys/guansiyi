<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="三级项目 网页元素设计：网易云音乐三个典型网页元素总览">
    <title>三级项目 网页元素设计 · 网易云音乐</title>
    <!--
        姓名：关斯译
        学号：24001010318
        班级：计算机24003班
        日期：2026-10-25
        功能名称：三级项目 —— 网页元素设计（总览页）。汇总三个独立元素页面：
                  元素一 上图下文（热门推荐歌单卡片）、元素二 左图右文（榜单）、元素三 列表（入驻歌手）。
    -->
    <link rel="stylesheet" href="font/css/all.min.css">
    <style>
        /* ==================== 全局公共样式 ==================== */
        :root {
            --guan_red: #c20c0c;
            --guan_dark: #242424;
            --guan_text: #333;
            --guan_sub: #8a8a8a;
            --guan_line: #e1e1e1;
            --guan_bg: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: var(--guan_text);
            background: var(--guan_bg);
            font: 14px/1.7 Arial, "Microsoft YaHei", sans-serif;
        }

        ul {
            list-style: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .guan_header {
            color: #ccc;
            background: var(--guan_dark);
        }

        .guan_header_inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px;
            min-height: 52px;
        }

        .guan_logo {
            color: #fff;
            font-size: 15px;
        }

        .guan_logo i {
            margin-right: 6px;
            color: var(--guan_red);
        }

        .guan_page {
            max-width: 960px;
            margin: 30px auto 40px;
            padding: 0 20px;
        }

        .guan_title {
            font-size: 20px;
            font-weight: normal;
        }

        .guan_sub {
            margin-top: 6px;
            color: var(--guan_sub);
            font-size: 13px;
        }

        .guan_overview {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-top: 22px;
        }

        .guan_item {
            display: block;
            padding: 18px;
            border: 1px solid var(--guan_line);
            background: #fff;
        }

        .guan_item_no {
            color: var(--guan_red);
            font-size: 12px;
        }

        .guan_item_name {
            margin-top: 4px;
            font-size: 16px;
        }

        .guan_item_desc {
            margin-top: 6px;
            color: var(--guan_sub);
            font-size: 12px;
            line-height: 1.8;
        }

        .guan_item_go {
            margin-top: 12px;
            color: var(--guan_red);
            font-size: 12px;
        }

        @media (max-width: 780px) {
            .guan_overview {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="guan_header">
        <div class="guan_header_inner">
            <p class="guan_logo"><i class="fa-solid fa-music"></i>网易云音乐 · 网页元素设计</p>
        </div>
    </header>

    <main class="guan_page">
        <h1 class="guan_title">三级项目 · 网页元素设计（总览）</h1>
        <p class="guan_sub">围绕网易云音乐主题，选取上图下文、左图右文、列表三个典型网页元素，一元素一页面。</p>

        <ul class="guan_overview">
            <li>
                <a class="guan_item" href="3-1 上图下文.html">
                    <p class="guan_item_no">元素一</p>
                    <h2 class="guan_item_name">上图下文</h2>
                    <p class="guan_item_desc">热门推荐歌单卡片，四列 Grid 等宽网格，封面在上、标题在下。</p>
                    <p class="guan_item_go">进入页面 <i class="fa-solid fa-angle-right"></i></p>
                </a>
            </li>
            <li>
                <a class="guan_item" href="3-2 左图右文.html">
                    <p class="guan_item_no">元素二</p>
                    <h2 class="guan_item_name">左图右文</h2>
                    <p class="guan_item_desc">榜单卡片，左侧榜单封面、右侧榜名与按钮，下方 Top10 歌曲列表。</p>
                    <p class="guan_item_go">进入页面 <i class="fa-solid fa-angle-right"></i></p>
                </a>
            </li>
            <li>
                <a class="guan_item" href="3-3 列表.html">
                    <p class="guan_item_no">元素三</p>
                    <h2 class="guan_item_name">列表</h2>
                    <p class="guan_item_desc">入驻歌手列表，头像 + 歌手名 + 简介的纵向列表，文字单行省略。</p>
                    <p class="guan_item_go">进入页面 <i class="fa-solid fa-angle-right"></i></p>
                </a>
            </li>
        </ul>
    </main>
</body>
</html>
