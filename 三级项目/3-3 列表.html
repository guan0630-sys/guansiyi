<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="三级项目 网页元素设计：元素三 列表，网易云音乐入驻歌手列表">
    <title>元素三 列表 · 网易云音乐入驻歌手</title>
    <!--
        姓名：关斯译
        学号：24001010318
        班级：计算机24003班
        日期：2026-10-25
        功能名称：三级项目 —— 网页元素设计（元素三：列表）。
                  以网易云音乐首页侧栏「入驻歌手」为原型，使用 ul/li 语义化列表 + Flex
                  完成"头像 + 歌手名 + 简介"的纵向列表，行内文字单行溢出省略，
                  纯静态显示效果，不含任何交互与动画。
    -->
    <link rel="stylesheet" href="font/css/all.min.css">
    <style>
        /* ==================== 全局公共样式 ==================== */
        :root {
            --guan_red: #c20c0c;
            --guan_dark: #242424;
            --guan_text: #333;
            --guan_sub: #8a8a8a;
            --guan_line: #e1e1e1;
            --guan_bg: #f5f5f5;
            --guan_panel: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: var(--guan_text);
            background: var(--guan_bg);
            font: 14px/1.7 Arial, "Microsoft YaHei", sans-serif;
        }

        ul,
        ol {
            list-style: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            max-width: 100%;
            border: 0;
        }

        /* ==================== 页面骨架 ==================== */
        .guan_header {
            color: #ccc;
            background: var(--guan_dark);
        }

        .guan_header_inner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px;
            min-height: 52px;
        }

        .guan_logo {
            color: #fff;
            font-size: 15px;
        }

        .guan_logo i {
            margin-right: 6px;
            color: var(--guan_red);
        }

        .guan_nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .guan_nav_link {
            padding: 5px 12px;
            border-radius: 4px;
            color: #bdbdbd;
            font-size: 13px;
        }

        .guan_nav_link:hover {
            color: #fff;
            background: #333;
        }

        .guan_nav_link--on {
            color: #fff;
            background: var(--guan_red);
        }

        .guan_page {
            max-width: 960px;
            margin: 26px auto 40px;
            padding: 0 20px;
        }

        .guan_tip {
            margin-bottom: 14px;
            padding: 10px 14px;
            border-left: 3px solid var(--guan_red);
            color: var(--guan_sub);
            background: #fff;
            font-size: 13px;
        }

        .guan_tip b {
            color: var(--guan_text);
        }

        .guan_panel {
            padding: 22px 20px 26px;
            background: var(--guan_panel);
            border: 1px solid var(--guan_line);
        }

        .guan_section_hd {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--guan_line);
        }

        .guan_section_title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 16px;
            font-weight: normal;
        }

        .guan_section_title::before {
            content: "";
            width: 4px;
            height: 15px;
            background: var(--guan_red);
        }

        .guan_more {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 2px;
            color: #666;
            font-size: 12px;
        }

        /* ==================== 元素三：列表 ==================== */
        .guan_enterlist {
            margin-top: 18px;
        }

        .guan_enter + .guan_enter {
            margin-top: 14px;
        }

        .guan_enter_link {
            display: flex;
            align-items: stretch;
            gap: 0;
            border: 1px solid #e9e9e9;
            background: #fafafa;
        }

        .guan_enter_avatar {
            flex: 0 0 62px;
            width: 62px;
            height: 62px;
            object-fit: cover;
        }

        .guan_enter_info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
            flex: 1 1 auto;
            padding: 0 14px;
        }

        .guan_enter_name {
            display: block;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .guan_enter_desc {
            display: block;
            margin-top: 4px;
            color: var(--guan_sub);
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .guan_enter_btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            margin-top: 16px;
            border: 1px solid #d5d5d5;
            border-radius: 4px;
            color: #333;
            background: #fafafa;
            font-size: 12px;
        }

        .guan_enter_btn i {
            margin-right: 5px;
            color: var(--guan_red);
            font-size: 11px;
        }

        /* ==================== 响应式 ==================== */
        @media (max-width: 780px) {
            .guan_enter_info {
                padding: 0 10px;
            }

            .guan_enter_name {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header class="guan_header">
        <div class="guan_header_inner">
            <p class="guan_logo"><i class="fa-solid fa-music"></i>网易云音乐 · 网页元素设计</p>
            <nav class="guan_nav">
                <a class="guan_nav_link" href="3-1 上图下文.html">元素一 上图下文</a>
                <a class="guan_nav_link" href="3-2 左图右文.html">元素二 左图右文</a>
                <a class="guan_nav_link guan_nav_link--on" href="3-3 列表.html">元素三 列表</a>
            </nav>
        </div>
    </header>

    <main class="guan_page">
        <p class="guan_tip">
            <b>元素三 · 列表</b>：纵向排列的「入驻歌手」列表，每行由头像、歌手名与简介组成，
            文字超出宽度时以省略号截断。原型为网易云音乐首页侧栏「入驻歌手」区块。
        </p>

        <section class="guan_panel">
            <div class="guan_section_hd">
                <h1 class="guan_section_title">入驻歌手</h1>
                <a class="guan_more" href="#">查看全部 <i class="fa-solid fa-angle-right"></i></a>
            </div>

            <ul class="guan_enterlist">
                <li class="guan_enter">
                    <a class="guan_enter_link" href="#">
                        <img class="guan_enter_avatar" src="img/singer_0.jpg" alt="张惠妹aMEI 头像">
                        <span class="guan_enter_info">
                            <strong class="guan_enter_name">张惠妹aMEI</strong>
                            <span class="guan_enter_desc">台湾歌手张惠妹</span>
                        </span>
                    </a>
                </li>
                <li class="guan_enter">
                    <a class="guan_enter_link" href="#">
                        <img class="guan_enter_avatar" src="img/singer_1.jpg" alt="吴莫愁Momo 头像">
                        <span class="guan_enter_info">
                            <strong class="guan_enter_name">吴莫愁Momo</strong>
                            <span class="guan_enter_desc">《中国好声音》选手吴莫愁</span>
                        </span>
                    </a>
                </li>
                <li class="guan_enter">
                    <a class="guan_enter_link" href="#">
                        <img class="guan_enter_avatar" src="img/singer_2.jpg" alt="孙楠 头像">
                        <span class="guan_enter_info">
                            <strong class="guan_enter_name">孙楠</strong>
                            <span class="guan_enter_desc">歌手孙楠 代表作《你快回来》《燃烧》</span>
                        </span>
                    </a>
                </li>
                <li class="guan_enter">
                    <a class="guan_enter_link" href="#">
                        <img class="guan_enter_avatar" src="img/singer_3.jpg" alt="麦田老狼 头像">
                        <span class="guan_enter_info">
                            <strong class="guan_enter_name">麦田老狼</strong>
                            <span class="guan_enter_desc">歌手，音乐人。代表作《同桌的你》等。</span>
                        </span>
                    </a>
                </li>
                <li class="guan_enter">
                    <a class="guan_enter_link" href="#">
                        <img class="guan_enter_avatar" src="img/singer_4.jpg" alt="陈楚生 头像">
                        <span class="guan_enter_info">
                            <strong class="guan_enter_name">陈楚生</strong>
                            <span class="guan_enter_desc">唱作歌手</span>
                        </span>
                    </a>
                </li>
            </ul>

            <a class="guan_enter_btn" href="#"><i class="fa-solid fa-user-plus"></i>申请成为网易音乐人</a>
        </section>
    </main>
</body>
</html>
