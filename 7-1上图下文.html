<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        *{
            padding: 0;
            margin:0; /* 补上margin重置 */
        }
        ul{
            list-style: none;
        }
        .img{
            display: block;
        }
        .ilist{
            display: flex;
            margin: 8px;
        }
        .ilist li{
            width: 30%;
            margin-right: 1px;
            flex-grow: 1;
            /* 重点：给父li加上相对定位 */
            position: relative;
        }
        .ilist img{
            width: 100%;
            display:block; /* 图片默认底部有缝隙，加上 */
        }
        .ilist p{
            text-align: center;
            font-size: 14px;
            line-height:33px;
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            background-color: rgba(0,0,0,.5);
            color: #fff;
            margin:0;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul class="ilist">
        <li>
            <img src="./1.jpg">
            <p>关斯译的上下图文</p>
        </li>
        <li>
            <img src="./2.jpg">
            <p>图片2</p>
        </li>
        <li>
            <img src="./3.jpg">
            <p>图片3</p>
        </li>
    </ul>
</body>
</html>
