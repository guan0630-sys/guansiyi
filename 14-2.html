<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 六种基本数据类型</title>
    <!--
        姓名：关斯译
        日期：2026-10-22
        功能名称：演示JavaScript基本的六种数据类型
    -->
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px;
            color: #333;
        }
        .guan_wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            padding: 30px 40px;
        }
        .guan_title {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        .guan_subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-top: -18px;
            margin-bottom: 30px;
        }
        .guan_card {
            border-left: 5px solid #3498db;
            background: #fafafa;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .guan_card0 {
            border-left-color: #e74c3c;
        }
        .guan_card1 {
            border-left-color: #e67e22;
        }
        .guan_card2 {
            border-left-color: #f1c40f;
        }
        .guan_card3 {
            border-left-color: #2ecc71;
        }
        .guan_card4 {
            border-left-color: #9b59b6;
        }
        .guan_card5 {
            border-left-color: #34495e;
        }
        .guan_type {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
        }
        .guan_desc {
            color: #7f8c8d;
            font-size: 0.9em;
        }
        .guan_code {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 10px 14px;
            border-radius: 6px;
            font-family: Consolas, monospace;
            font-size: 0.95em;
            margin-top: 10px;
        }
        .guan_value {
            color: #f39c12;
            font-weight: bold;
        }
        button {
            cursor: pointer;
        }
        .guan_btn {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 0.95em;
            margin-top: 10px;
        }
        .guan_btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="guan_wrapper">
        <h1 class="guan_title">JavaScript 六种基本数据类型</h1>
        <p class="guan_subtitle">Number / String / Boolean / Null / Undefined / Symbol</p>

        <div class="guan_card0" id="guan_types"></div>
    </div>

    <script>
        // ===== 定义六种基本数据类型的示例 =====
        var guan_num = 42;                 // Number 数字类型
        var guan_str = "你好，关斯译";      // String 字符串类型
        var guan_bool = true;              // Boolean 布尔类型
        var guan_null = null;              // Null 空类型
        var guan_undefined;                // Undefined 未定义类型
        var guan_symbol = Symbol("id");    // Symbol 符号类型

        // ===== 数组用于渲染 =====
        var guan_types = [
            { name: "Number（数字类型）", desc: "表示整数或浮点数", value: guan_num, code: 'var guan_num = 42;', cls: "guan_card0" },
            { name: "String（字符串类型）", desc: "表示文本字符的序列", value: guan_str, code: 'var guan_str = "你好，关斯译";', cls: "guan_card1" },
            { name: "Boolean（布尔类型）", desc: "只有 true 或 false 两个值", value: guan_bool, code: 'var guan_bool = true;', cls: "guan_card2" },
            { name: "Null（空类型）", desc: "表示一个空值或空对象引用", value: guan_null, code: "var guan_null = null;", cls: "guan_card3" },
            { name: "Undefined（未定义类型）", desc: "变量声明但未赋值时的值", value: guan_undefined, code: "var guan_undefined;", cls: "guan_card4" },
            { name: "Symbol（符号类型）", desc: "唯一的、不可变的值，常用于对象属性键", value: String(guan_symbol), code: 'var guan_symbol = Symbol("id");', cls: "guan_card5" }
        ];

        // ===== 动态渲染卡片到页面 =====
        function guan_renderTypes(guan_data) {
            var guan_html = "";
            for (var guan_i = 0; guan_i < guan_data.length; guan_i++) {
                var guan_item = guan_data[guan_i];
                guan_html += '<div class="guan_card ' + guan_item.cls + '">';
                guan_html += '<div class="guan_type">' + guan_item.name + '</div>';
                guan_html += '<div class="guan_desc">' + guan_item.desc + '</div>';
                guan_html += '<div class="guan_code">' + guan_item.code + '<br>值：<span class="guan_value">' + guan_item.value + '</span></div>';
                guan_html += '</div>';
            }
            document.getElementById("guan_types").innerHTML = guan_html;
        }
        guan_renderTypes(guan_types);

        // ===== 控制台输出六种数据类型及 typeof 结果 =====
        console.log("Number 类型：", guan_num, "| typeof:", typeof guan_num);
        console.log("String 类型：", guan_str, "| typeof:", typeof guan_str);
        console.log("Boolean 类型：", guan_bool, "| typeof:", typeof guan_bool);
        console.log("Null 类型：", guan_null, "| typeof:", typeof guan_null);
        console.log("Undefined 类型：", guan_undefined, "| typeof:", typeof guan_undefined);
        console.log("Symbol 类型：", guan_symbol, "| typeof:", typeof guan_symbol);
    </script>
</body>
</html>
