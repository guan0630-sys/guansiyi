<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-2.html - CSS动画幻灯片</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 幻灯片容器 */
        .slideshow-container {
            position: relative;
            width: 800px;
            max-width: 100%;
            height: 600px;
            background-color: #fff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            overflow: hidden;
        }

        /* 每一张幻灯片 */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0; /* 默认隐藏 */
            animation: slideAnimation 16s infinite; /* 4张图，每张4秒，总时长16秒 */
        }

        /* 图片样式 */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 文字样式 */
        .slide .text-content {
            position: absolute;
            right: 0;
            bottom: 0;
            left: 0;
            height: 30%;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #111;
            background-color: rgba(255, 255, 255, 0.82);
        }

        .slide .text-content h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #111;
        }

        .slide .text-content p {
            font-size: 18px;
            line-height: 1.5;
            color: #222;
        }

        /* CSS3 关键帧动画逻辑 */
        /* 4张图片，总周期16s */
        /* 每张图片展示时间大约为 25% (4s)，过渡时间分配在头尾 */
        @keyframes slideAnimation {
            0%    { opacity: 0; }
            2%    { opacity: 1; }  /* 淡入 */
            23%   { opacity: 1; }  /* 停留展示 */
            25%   { opacity: 0; }  /* 淡出 */
            100%  { opacity: 0; }  /* 等待周期结束 */
        }

        /* 为每张幻灯片设置动画延迟，实现轮流播放 */
        .slide:nth-child(1) {
            animation-delay: 0s;
        }
        .slide:nth-child(2) {
            animation-delay: 4s;
        }
        .slide:nth-child(3) {
            animation-delay: 8s;
        }
        .slide:nth-child(4) {
            animation-delay: 12s;
        }

        /* 为文字增加一点额外的入场动画效果 */
        .text-content h2, .text-content p {
            animation: textFadeIn 1s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes textFadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 让文字动画跟随幻灯片周期循环触发 */
        .slide:nth-child(1) .text-content h2, .slide:nth-child(1) .text-content p { animation-delay: 0.2s; }
        .slide:nth-child(2) .text-content h2, .slide:nth-child(2) .text-content p { animation-delay: 4.2s; }
        .slide:nth-child(3) .text-content h2, .slide:nth-child(3) .text-content p { animation-delay: 8.2s; }
        .slide:nth-child(4) .text-content h2, .slide:nth-child(4) .text-content p { animation-delay: 12.2s; }

    </style>
</head>
<body>

    <div class="slideshow-container">
        <!-- 幻灯片 1 -->
        <div class="slide">
            <img src="img/1.jpg" alt="图片1">
            <div class="text-content">
                <h2>第一帧标题</h2>
                <p>这是基于CSS Animation的幻灯片，当前展示的是关斯译的相关内容。</p>
            </div>
        </div>

        <!-- 幻灯片 2 -->
        <div class="slide">
            <img src="img/2.jpg" alt="图片2">
            <div class="text-content">
                <h2>关斯译</h2>
                <p>纯CSS实现上图下文的轮播效果，无需任何JavaScript脚本。</p>
            </div>
        </div>

        <!-- 幻灯片 3 -->
        <div class="slide">
            <img src="img/3.jpg" alt="图片3">
            <div class="text-content">
                <h2>第三帧标题</h2>
                <p>利用绝对定位与透明度变化，平滑过渡每一帧画面。</p>
            </div>
        </div>

        <!-- 幻灯片 4 -->
        <div class="slide">
            <img src="img/4.jpg" alt="图片4">
            <div class="text-content">
                <h2>第四帧标题</h2>
                <p>感谢关斯译的浏览，幻灯片即将重新循环播放。</p>
            </div>
        </div>
    </div>

</body>
</html>
