<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001010318关斯译</title>
    <style>
        p{
            color:#94a;
            font-size: 50px;
        }
        /* h2：白底黑字 */
        h2{
            background-color: #000;
            color: #fff;
        }
        /*标签选择器*/
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
        /* 新增盒子：宽300高300 */
#box2{
    width: 300px;
    height: 300px;
    background-color: lightblue; /* 背景颜色，可自行更换 */
}

        /* 名字三个字各自的颜色 */
        .n1{
            color: blue;   /* 关 */
        }
        .n2{
            color:#94a;    /* 斯 */
        }
        .n3{
            color: bisque; /* 译 */
        }
        /* “选择器”三个字为白色 */
        .white{
            color: white;
        }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
<div id="box">
    <p>CSS<span class="white">选择器</span></p>
    <p><span class="n1">关</span><span class="n2">斯</span><span class="n3">译</span></p>
    <p>CSS属性</p>
</div>
<!-- 新增的 300x300 盒子 -->
<div id="box2"></div>
</body>
</html>
